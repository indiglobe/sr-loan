name: sr-loan-prod

networks:
  sr-loan-prod:
    driver: bridge

services:
  sr-loan-prod-phpmyadmin:
    container_name: sr-loan-prod-phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "13184:80"
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    networks:
      - sr-loan-prod
    env_file:
      - ../.env.production

volumes:
  database:
