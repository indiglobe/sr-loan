name: Deploy Dockerized Web App (Campus) to VPS

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub using PAT
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # 3. Build and push Docker image with build-time environment variables
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sr-loan/dashboard:latest
          file: ./apps/dashboard/Dockerfile
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

