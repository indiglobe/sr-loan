name: Deploy Dockerized Web App (Dashboard) to VPS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/dashboard/**"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using PAT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # 3. Build and push Docker image with build-time environment variables
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sr-loan-dashboard:latest
          file: ./apps/dashboard/Dockerfile
          build-args: |
            VITE_DASHBOARD_APP_HOST=${{ secrets.VITE_DASHBOARD_APP_HOST }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            TOKEN_SECRET=${{ secrets.TOKEN_SECRET }}
            SALT_ROUND=${{ secrets.SALT_ROUND }}
            DASHBOARD_APP_HOST=${{ secrets.DASHBOARD_APP_HOST }}

      - name: Trigger Dockploy deployment
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.DOCKPLOY_WEBHOOK_URL }}"
